# Supabase CLI config — KG Recruit App
# Linked project: kg-recruit-app (ref twxfixwoplyctvwtbpkm, ap-southeast-1)

project_id = "kg-recruit-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://kg.taylab.com"]
jwt_expiry = 3600
enable_signup = false   # invite-only — no public signup
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"
